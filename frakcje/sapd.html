<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<title>SAPD</title>
<style>
body{margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#1e1e1e;color:#e6e6e6}
h1{font-size:22px;color:#d49822;margin:0 0 20px}
ul{list-style:none;padding:0;margin:0;max-width:720px}
li{margin:0 0 10px}
a{display:block;padding:12px 16px;background:#2a2a2a;border-left:4px solid #d49822;color:#e6e6e6;text-decoration:none;border-radius:4px}
a:hover{background:#353535}
</style>
</head>
<body>
<h1>SAPD</h1>
<ul>
<li><a href="akademia.html" data-key="akademia">AKADEMIA</a></li>
<li><a href="zarzad.html" data-key="zarzad">ZARZĄD</a></li>
<li><a href="pelnoprawni.html" data-key="pelnoprawni">PEŁNOPRAWNI</a></li>
</ul>
<script>
const H = {
akademia: "7c5534f22ff5eb95c93f9221f997f1a3cdd14e4819e044c868390c50463a1b9d",
zarzad: "b8de34df7463a8a763b81a18680cb715ec3d2f4f816c4bfe5a346a0d8236546a",
pelnoprawni: "aa584cd2367de61614537569fe703e26a20a695f3b0a8f17c90259c68ceaa4d6"
};
async function sha(t){
const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function ask(key){
alert('podaj hasło');
const p = prompt('Hasło:');
if (p === null) return false;
return (await sha(p)) === H[key];
}
document.querySelectorAll('a[data-key]').forEach(a => {
a.addEventListener('click', async e => {
e.preventDefault();
const href = a.getAttribute('href');
if (await ask(a.dataset.key)) {
location.href = href;
} else {
alert('Złe hasło');
}
});
});
</script>
</body>
