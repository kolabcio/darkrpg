<body style="visibility:hidden">

<ul>
<li><a href="frakcje/frakcje.html" data-key="frakcje">FRAKCJE</a></li>
<li><a href="biznesy/biznesy.html" data-key="biznesy">BIZNESY</a></li>
<li><a href="organizacje/organizacje.html" data-key="organizacje">ORGANIZACJE</a></li>
<li><a href="administracja/administracja.html" data-key="administracja">ADMINISTRACJA</a></li>
</ul>
<script>
const H = {
idx: "c862fd6fcfa09e5f5c3b7fff9c77b7855f2f828f103e67a8ec62b1639508d6ef",
frakcje: "676f6688b945635cb41153b2dd3f5661c878e37d3ae41b571684e0dc6fdbe5f9",
biznesy: "c437937dce8f466f7f5adb159164251523ee23ec3e30812aad3924425ce58e83",
organizacje: "2643a7daf8f14d4d9b2ba0eb18e5c4c32bb2d9083bb89b83595b7eb5e9811799",
administracja: "c8b2e5a61b22a509ce85286e40a13a69f5fc8dce0fa9891566eb11bdf305ee81"
};
async function sha(t){
const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function ask(key){
alert('podaj hasło');
const p = prompt('Hasło:');
if (p === null) return false;
return (await sha(p)) === H[key];
}
(async () => {
if (await ask('idx')) {
document.body.style.visibility = 'visible';
} else {
document.body.innerHTML = '';
}
})();
document.querySelectorAll('a[data-key]').forEach(a => {
a.addEventListener('click', async e => {
e.preventDefault();
const href = a.getAttribute('href');
if (await ask(a.dataset.key)) {
location.href = href;
} else {
alert('Złe hasło');
}
});
});
</script>
</body>
